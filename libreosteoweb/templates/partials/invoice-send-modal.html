{% load i18n %}
<div class="modal-header">
    <h3 class="modal-title">{% trans 'Sending invoice' %}</h3>
</div>
<form novalidate name="form">
<div class="modal-body">
  <div bind-html-compile="message"></div> 
  <div class="form-group">
    <label class="sr-only" for="email">{% trans 'Destination email' %}</label>
      <div class="input-group">
        <input type="text" class="form-control" id="email" ng-model="email" placeholder="{%trans 'Email' %}" ui-validate=" 'validateEmail($value)' ">
      </div>
    </div>
  </div>
</div>
<div class="modal-footer">
    <button id="modal-btn-ok" class="btn btn-primary" ng-click="ok()" ng-disabled="form.$invalid">{% trans 'Ok' %}</button>
    <button id="modal-btn-cancel" class="btn btn-danger" ng-click="cancel()">{% trans 'Cancel' %}</button>
</div>
</form>
